version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 顔検出（anime-face-detector 0.0.9）は mmcv-full 1.7.0 + torch 1.13.1 + Python 3.10 でしか動かない。
    # 上げると動かなくなる物は提案させない（理由は .github/SECURITY.md・tools/audit.py と同じ）。
    # The face detector only works with mmcv-full 1.7.0 + torch 1.13.1 + Python 3.10.
    ignore:
      - dependency-name: "anime-face-detector"
      - dependency-name: "mmcv-full"
      - dependency-name: "mmdet"
      - dependency-name: "mmpose"
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      # torch 1.13.1 は起動時に pkg_resources.packaging を使う。setuptools 70 で無くなった。
      - dependency-name: "setuptools"
        versions: [">=70"]
      # torch 1.13 は NumPy 2 に対応していない。
      - dependency-name: "numpy"
        versions: [">=2"]
      # opencv-python 4.12 以上は NumPy 2 が要る。
      - dependency-name: "opencv-python"
        versions: [">=4.12"]
      # Pillow 13 以上は Python 3.11 以上が要る。
      - dependency-name: "pillow"
        versions: [">=13"]
